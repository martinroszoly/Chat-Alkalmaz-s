<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Üzenetek – Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#1684ff;--ink:#152033;--muted:#8993a5;--line:#edf0f4;--paper:#fff;--bg:#f4f6fa;--soft:#f0f2f5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',sans-serif;height:100vh;overflow:hidden}.shell{height:100vh;max-width:1560px;margin:auto;background:#fff;display:grid;grid-template-columns:76px 360px 1fr;box-shadow:0 0 48px #28364a12}.rail{background:#fff;border-right:1px solid var(--line);display:flex;align-items:center;flex-direction:column;padding:23px 0;gap:20px}.brand{width:44px;height:44px;background:linear-gradient(135deg,#20b1ff,#286bff);color:#fff;border-radius:15px;display:grid;place-items:center;font-size:23px;font-weight:800;margin-bottom:20px;box-shadow:0 6px 14px #1684ff44}.rail-btn{width:44px;height:44px;border:0;border-radius:14px;background:transparent;color:#9aa4b4;font-size:20px;cursor:pointer;position:relative}.rail-btn:hover,.rail-btn.active{background:#edf5ff;color:var(--blue)}.rail-spacer{flex:1}.rail-avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;cursor:pointer;border:2px solid white;box-shadow:0 0 0 1px #e8ebf0}.sidebar{border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}.side-head{padding:30px 25px 20px}.head-row{display:flex;align-items:center;justify-content:space-between}.head-row h1{font:800 26px Manrope,sans-serif;margin:0;letter-spacing:-1px}.round-action{width:37px;height:37px;border:0;border-radius:50%;background:#eff3f8;color:#26354b;font-size:20px;cursor:pointer}.tabs{display:flex;gap:8px;margin-top:23px}.tab{border:0;background:none;padding:8px 14px;border-radius:20px;color:#8791a0;font:600 13px inherit;cursor:pointer}.tab.active{background:#eaf3ff;color:var(--blue)}.search{margin:0 20px 14px;background:#f2f4f7;border-radius:11px;padding:0 13px;display:flex;align-items:center;gap:9px;height:40px;color:#929bab}.search input{border:0;outline:0;background:transparent;font:14px inherit;width:100%;color:var(--ink)}.list{overflow:auto;padding:2px 10px}.person{width:100%;border:0;background:transparent;display:flex;align-items:center;text-align:left;gap:12px;padding:11px 12px;border-radius:13px;cursor:pointer}.person:hover{background:#f6f8fb}.person.selected{background:#edf5ff}.avatar-wrap{position:relative;flex-shrink:0}.avatar{width:49px;height:49px;border-radius:50%;object-fit:cover;background:#e8edf4}.online{position:absolute;right:0;bottom:2px;width:12px;height:12px;background:#28c76f;border:2px solid white;border-radius:50%}.person-meta{min-width:0;flex:1}.person-top{display:flex;justify-content:space-between;gap:6px;align-items:center}.person-name{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.time{color:#9ca5b2;font-size:11px;white-space:nowrap}.preview{font-size:12px;color:#929bab;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.badge{background:var(--blue);color:#fff;border-radius:10px;font-size:10px;padding:2px 6px}.chat{min-width:0;display:flex;flex-direction:column;background:white}.chat-head{height:78px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 27px;gap:12px}.chat-person{flex:1;min-width:0}.chat-person strong{display:block;font-size:15px}.chat-person span{font-size:12px;color:#28b76b}.head-tools{display:flex;gap:9px}.tool{border:0;width:37px;height:37px;border-radius:50%;background:#f1f4f8;color:#657187;font-size:17px;cursor:pointer}.tool:hover{color:var(--blue);background:#eaf3ff}.chat-body{flex:1;overflow:auto;padding:26px clamp(18px,5vw,76px);display:flex;flex-direction:column;gap:13px;background:linear-gradient(#fff,#fff)}.day{text-align:center;color:#a0a8b3;font-size:11px;margin:1px 0 8px}.msg-row{display:flex;align-items:flex-end;gap:8px;max-width:75%}.msg-row.mine{align-self:flex-end;flex-direction:row-reverse}.msg-avatar{width:27px;height:27px;border-radius:50%;object-fit:cover}.bubble{padding:11px 15px;border-radius:18px;background:#f0f2f5;color:#283246;font-size:14px;line-height:1.45;max-width:100%;word-break:break-word}.msg-row:not(.mine) .bubble{border-bottom-left-radius:5px}.msg-row.mine .bubble{background:linear-gradient(130deg,#2399ff,#0875f4);color:#fff;border-bottom-right-radius:5px}.msg-time{font-size:10px;color:#9ba5b2;margin:0 4px 1px}.composer{padding:14px 24px 22px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px}.compose-btn{border:0;background:none;color:#7d8899;font-size:20px;cursor:pointer;width:30px}.compose-input{flex:1;border:0;outline:0;background:#f2f4f7;border-radius:24px;height:44px;padding:0 18px;font:14px 'DM Sans';min-width:0}.send{border:0;background:var(--blue);color:white;border-radius:50%;width:42px;height:42px;font-size:17px;cursor:pointer;box-shadow:0 3px 9px #1684ff50}.send:hover{background:#0871e6}.empty{padding:35px;text-align:center;color:#9aa3b0;font-size:13px}.profile{display:none;flex:1;overflow:auto;background:#f8f9fb;padding:32px clamp(20px,6vw,90px)}.profile-card{max-width:700px;margin:auto;background:#fff;border:1px solid var(--line);border-radius:22px;padding:30px;box-shadow:0 8px 30px #1f34500a}.profile-title{font:800 24px Manrope;margin:0 0 25px}.profile-hero{display:flex;align-items:center;gap:18px;padding-bottom:24px;border-bottom:1px solid var(--line)}.big-avatar{width:94px;height:94px;border-radius:50%;object-fit:cover;background:#edf1f5}.hero-info h2{margin:0 0 5px;font:700 21px Manrope}.hero-info p{margin:0;color:#909aaa;font-size:13px}.blue-btn{border:0;background:#edf5ff;color:var(--blue);font-weight:700;padding:9px 13px;border-radius:9px;cursor:pointer;margin-top:12px}.field{margin-top:21px}.field label{display:block;font-size:12px;font-weight:700;color:#697487;margin-bottom:8px}.field input{height:44px;border:1px solid #e6eaf0;border-radius:10px;width:100%;padding:0 13px;font:14px 'DM Sans';outline-color:#8dbdff}.photos{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}.photo-thumb{width:68px;height:68px;border-radius:12px;object-fit:cover}.add-photo{width:68px;height:68px;border-radius:12px;border:1px dashed #b7c5d8;background:#fafcff;color:#8393a9;font-size:24px;cursor:pointer}.setting-row{display:flex;align-items:center;justify-content:space-between;padding:17px 0;border-bottom:1px solid var(--line);font-size:13px}.setting-row span{color:#8791a0}.toggle{width:40px;height:23px;border:0;border-radius:20px;background:#d8dee7;position:relative;cursor:pointer}.toggle:after{content:'';position:absolute;width:17px;height:17px;border-radius:50%;background:white;top:3px;left:3px;transition:.2s}.toggle.on{background:var(--blue)}.toggle.on:after{left:20px}.profile-tab .profile{display:block}.profile-tab .chat{display:none}.profile-tab .sidebar{display:none}.profile-tab{grid-template-columns:76px 1fr}.group-modal{position:fixed;inset:0;background:#101d3280;display:none;place-items:center;z-index:5}.modal-box{background:white;width:min(420px,calc(100vw - 30px));padding:25px;border-radius:20px;box-shadow:0 20px 80px #0003}.modal-box h3{font:800 20px Manrope;margin:0 0 18px}.modal-box input,.modal-box select{width:100%;padding:12px;border:1px solid #e2e7ef;border-radius:10px;margin:6px 0 14px;font:14px 'DM Sans'}.modal-actions{display:flex;justify-content:flex-end;gap:8px}.modal-actions button{padding:10px 16px;border:0;border-radius:9px;cursor:pointer;font-weight:700}.cancel{background:#f1f3f6}.create{background:var(--blue);color:white}.file{display:none}.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:#172236;color:#fff;padding:11px 17px;border-radius:30px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:9}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}@media(max-width:800px){.shell{grid-template-columns:62px 290px 1fr}.chat-head{padding:0 15px}.chat-body{padding:20px 14px}.composer{padding:12px}.head-tools .tool:nth-child(1){display:none}}@media(max-width:620px){body{overflow:hidden}.shell{grid-template-columns:58px 1fr}.sidebar{display:flex}.chat{display:none}.profile{display:none}.shell.mobile-chat{grid-template-columns:58px 1fr}.mobile-chat .sidebar{display:none}.mobile-chat .chat{display:flex}.mobile-chat .profile{display:none}.mobile-chat.profile-tab .chat{display:none}.mobile-chat.profile-tab .profile{display:block}.side-head{padding:20px 16px 14px}.side-head h1{font-size:23px}.person{padding:10px 7px}.chat-head{height:68px}.back{display:block!important}.profile-tab{grid-template-columns:58px 1fr}.profile{padding:20px 12px}.profile-card{padding:20px}.composer{gap:5px}.compose-btn{width:25px}.msg-row{max-width:90%}}.back{display:none}
</style></head>
<body><div class="shell" id="shell"><nav class="rail"><div class="brand">✳</div><button class="rail-btn active" title="Csevegések" onclick="showChats()">◉</button><button class="rail-btn" title="Profil" onclick="showProfile()">♙</button><button class="rail-btn" title="Új csoport" onclick="openModal()">＋</button><div class="rail-spacer"></div><img id="railAvatar" class="rail-avatar" src="https://i.pravatar.cc/100?img=12" onclick="showProfile()"></nav>
<aside class="sidebar"><div class="side-head"><div class="head-row"><h1>Üzenetek</h1><button class="round-action" onclick="openModal()" title="Új csoport">＋</button></div><div class="tabs"><button class="tab active" onclick="setFilter('all',this)">Mind</button><button class="tab" onclick="setFilter('unread',this)">Olvasatlan</button><button class="tab" onclick="setFilter('groups',this)">Csoportok</button></div></div><label class="search"><span>⌕</span><input id="search" placeholder="Keresés" oninput="renderList()"></label><div class="list" id="list"></div></aside>
<main class="chat"><header class="chat-head"><button class="tool back" onclick="backToList()">‹</button><div class="avatar-wrap"><img class="avatar" id="chatAvatar" src=""><i class="online" id="chatOnline"></i></div><div class="chat-person"><strong id="chatName">Mira Kovács</strong><span id="chatStatus">● Aktív most</span></div><div class="head-tools"><button class="tool" title="Hanghívás" onclick="toast('A hanghívás hamarosan elérhető')">☎</button><button class="tool" title="Videóhívás" onclick="toast('A videóhívás hamarosan elérhető')">▣</button><button class="tool" title="Beszélgetés beállításai" onclick="openSettings()">ⓘ</button></div></header><section class="chat-body" id="messages"></section><form class="composer" id="form"><button type="button" class="compose-btn" onclick="document.getElementById('imageInput').click()" title="Fotó küldése">▧</button><input type="file" class="file" id="imageInput" accept="image/*"><button type="button" class="compose-btn" title="Emoji" onclick="document.getElementById('messageInput').value+=' 😊';document.getElementById('messageInput').focus()">☺</button><input class="compose-input" id="messageInput" placeholder="Írj egy üzenetet…" autocomplete="off"><button class="send" type="submit">➤</button></form></main>
<section class="profile"><div class="profile-card"><h1 class="profile-title">Profilom</h1><div class="profile-hero"><img id="profileAvatar" class="big-avatar" src="https://i.pravatar.cc/200?img=12"><div class="hero-info"><h2 id="profileNameView">Alex Morgan</h2><p id="profileEmailView">alex.morgan@email.com</p><button class="blue-btn" onclick="document.getElementById('avatarInput').click()">Profilkép módosítása</button></div></div><input class="file" id="avatarInput" type="file" accept="image/*"><div class="field"><label>Felhasználónév</label><input id="username" value="Alex Morgan" onchange="updateProfile()"></div><div class="field"><label>Email-cím</label><input id="email" type="email" value="alex.morgan@email.com" onchange="updateProfile()"></div><div class="field"><label>Bemutatkozó fotók</label><div class="photos" id="photos"><button class="add-photo" onclick="document.getElementById('galleryInput').click()">＋</button></div><input class="file" id="galleryInput" type="file" accept="image/*" multiple></div><div class="field" style="margin-top:30px"><label>Adatvédelem</label><div class="setting-row"><div><b>Eltűnő üzenetek</b><br><span>Alapértelmezett időzítő</span></div><select id="defaultTimer" onchange="saveTimer()" style="border:1px solid #e6eaf0;border-radius:8px;padding:8px;color:#526075"><option value="off">Ki</option><option value="1h">1 óra</option><option value="24h">24 óra</option><option value="7d">7 nap</option></select></div><div class="setting-row"><div><b>Aktív állapot megjelenítése</b><br><span>Mások láthatják, mikor vagy online</span></div><button class="toggle on" onclick="this.classList.toggle('on')"></button></div><div class="setting-row"><div><b>Értesítések</b><br><span>Üzenetekről szóló értesítések</span></div><button class="toggle on" onclick="this.classList.toggle('on')"></button></div></div><button class="blue-btn" style="margin-top:23px" onclick="toast('A profilod mentve')">Változtatások mentése</button></div></section></div>
<div class="group-modal" id="modal"><div class="modal-box"><h3 id="modalTitle">Új csoport létrehozása</h3><label style="font-size:12px;font-weight:700;color:#687487">Csoport neve</label><input id="groupName" placeholder="Például: Hétvégi tervek"><label style="font-size:12px;font-weight:700;color:#687487">Tagok meghívása</label><input id="groupMembers" placeholder="Felhasználónév vagy email"><div class="modal-actions"><button class="cancel" onclick="closeModal()">Mégse</button><button class="create" onclick="createGroup()">Csoport létrehozása</button></div></div></div><div class="toast" id="toast"></div>
<script>
const seed=[
{id:'mira',name:'Mira Kovács',avatar:'https://i.pravatar.cc/100?img=47',online:true,time:'most',unread:2,last:'Akkor holnap találkozunk! 😊',messages:[['them','Szia! Hogy telik a napod?','10:42'],['mine','Szia Mira! Egész jól, köszi 😊','10:43'],['them','Van kedved beülni valahova a hétvégén?','10:44'],['mine','Persze! Szombat délután jó neked?','10:46'],['them','Tökéletes! Ismerek egy szuper új helyet a belvárosban ☕','10:48'],['them','Akkor holnap találkozunk! 😊','10:49']]},
{id:'design',name:'Design csapat',avatar:'https://i.pravatar.cc/100?img=23',group:true,online:true,time:'9:32',unread:0,last:'Dani: Feltöltöttem a terveket',messages:[['them','Dani: Feltöltöttem a terveket a mappába 📐','9:26'],['mine','Szuper, mindjárt megnézem!','9:28'],['them','Lilla: Nekem is tetszik az új irány','9:32']]},
{id:'dani',name:'Dani Varga',avatar:'https://i.pravatar.cc/100?img=11',online:false,time:'Tegnap',unread:0,last:'Küldtem pár képet az útról',messages:[['them','Küldtem pár képet az útról 📸','Tegnap'],['mine','Már nézem is!','Tegnap']]},
{id:'family',name:'Család ❤️',avatar:'https://i.pravatar.cc/100?img=44',group:true,online:false,time:'Tegnap',unread:0,last:'Anya: Vasárnap ebéd nálunk?',messages:[['them','Anya: Vasárnap ebéd nálunk? 🍲','Tegnap'],['mine','Ott leszünk!','Tegnap']]},
{id:'lilla',name:'Lilla Tóth',avatar:'https://i.pravatar.cc/100?img=49',online:true,time:'Hétfő',unread:0,last:'Nagyon köszönöm! 💛',messages:[['mine','Boldog szülinapot még egyszer! 🎂','Hétfő'],['them','Nagyon köszönöm! 💛','Hétfő']]},
{id:'marci',name:'Marci',avatar:'https://i.pravatar.cc/100?img=15',online:false,time:'Vasárnap',unread:0,last:'Jó volt a meccs, majd ismételjük!',messages:[['them','Jó volt a meccs, majd ismételjük! ⚽','Vasárnap']]}
];let chats=JSON.parse(localStorage.getItem('chats')||'null')||seed;let current=chats[0].id,filter='all',timer=localStorage.getItem('defaultTimer')||'off';document.getElementById('defaultTimer').value=timer;
function persist(){localStorage.setItem('chats',JSON.stringify(chats))}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderList(){let q=document.getElementById('search').value.toLowerCase();let arr=chats.filter(c=>(filter==='all'||filter==='unread'&&c.unread||filter==='groups'&&c.group)&&c.name.toLowerCase().includes(q));document.getElementById('list').innerHTML=arr.length?arr.map(c=>`<button class="person ${c.id===current?'selected':''}" onclick="selectChat('${c.id}')"><span class="avatar-wrap"><img class="avatar" src="${c.avatar}">${c.online?'<i class="online"></i>':''}</span><span class="person-meta"><span class="person-top"><span class="person-name">${esc(c.name)}</span><span class="time">${esc(c.time||'most')}</span></span><span class="person-top"><span class="preview">${esc(c.last||'Nincs még üzenet')}</span>${c.unread?`<span class="badge">${c.unread}</span>`:''}</span></span></button>`).join(''):'<div class="empty">Nincs találat</div>'}
function renderMessages(){let c=chats.find(x=>x.id===current);if(!c)return;document.getElementById('chatName').textContent=c.name;document.getElementById('chatAvatar').src=c.avatar;document.getElementById('chatOnline').style.display=c.online?'block':'none';document.getElementById('chatStatus').textContent=c.group?'Csoport · '+(c.members||3)+' tag':c.online?'● Aktív most':'Legutóbb nemrég';document.getElementById('messages').innerHTML='<div class="day">MA</div>'+c.messages.map(m=>`<div class="msg-row ${m[0]==='mine'?'mine':''}">${m[0]==='them'?`<img class="msg-avatar" src="${c.avatar}">`:''}<div class="bubble">${esc(m[1])}</div><span class="msg-time">${esc(m[2])}</span></div>`).join('');let box=document.getElementById('messages');box.scrollTop=box.scrollHeight;c.unread=0;renderList()}
function selectChat(id){current=id;renderMessages();document.getElementById('shell').classList.add('mobile-chat')}function setFilter(f,b){filter=f;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderList()}function showProfile(){document.getElementById('shell').classList.add('profile-tab');document.querySelectorAll('.rail-btn').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.rail-btn')[1].classList.add('active')}function showChats(){document.getElementById('shell').classList.remove('profile-tab');document.querySelectorAll('.rail-btn').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.rail-btn')[0].classList.add('active')}function backToList(){document.getElementById('shell').classList.remove('mobile-chat')}
function sendMessage(text){text=text.trim();if(!text)return;let c=chats.find(x=>x.id===current);c.messages.push(['mine',text,new Date().toLocaleTimeString('hu-HU',{hour:'2-digit',minute:'2-digit'})]);c.last=text;c.time='most';persist();renderMessages()}document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();sendMessage(document.getElementById('messageInput').value);document.getElementById('messageInput').value=''});
document.getElementById('imageInput').addEventListener('change',e=>{let f=e.target.files[0];if(f){let c=chats.find(x=>x.id===current);c.messages.push(['mine','📷 '+f.name,new Date().toLocaleTimeString('hu-HU',{hour:'2-digit',minute:'2-digit'})]);c.last='📷 Fotó';persist();renderMessages();toast('Fotó hozzáadva a beszélgetéshez')}});
function openModal(){document.getElementById('modal').style.display='grid';document.getElementById('groupName').focus()}function closeModal(){document.getElementById('modal').style.display='none'}function createGroup(){let name=document.getElementById('groupName').value.trim();if(!name){toast('Adj nevet a csoportnak');return}let id='g'+Date.now();chats.unshift({id,name,avatar:'https://i.pravatar.cc/100?u='+encodeURIComponent(name),group:true,online:true,members:2,time:'most',unread:0,last:'A csoport létrejött',messages:[['them','Üdv a csoportban! Beszélgessetek bátran 👋','most']]});current=id;persist();renderMessages();renderList();closeModal();document.getElementById('groupName').value='';document.getElementById('groupMembers').value='';document.getElementById('shell').classList.add('mobile-chat')}
function openSettings(){let c=chats.find(x=>x.id===current);let choices=[['off','Ki'],['1h','1 óra'],['24h','24 óra'],['7d','7 nap']];let answer=prompt('Eltűnő üzenetek időzítője ('+choices.map(x=>x[1]).join(', ')+'):',c.timer||timer);if(answer===null)return;let map={'ki':'off','off':'off','1 óra':'1h','1h':'1h','24 óra':'24h','24h':'24h','7 nap':'7d','7d':'7d'};if(map[answer.toLowerCase()]){c.timer=map[answer.toLowerCase()];persist();toast('Eltűnő üzenetek: '+(choices.find(x=>x[0]===c.timer)[1]))}else toast('Választható: Ki, 1 óra, 24 óra vagy 7 nap')}
function saveTimer(){timer=document.getElementById('defaultTimer').value;localStorage.setItem('defaultTimer',timer);toast('Alapértelmezett időzítő mentve')}function updateProfile(){let n=document.getElementById('username').value||'Felhasználó',e=document.getElementById('email').value;document.getElementById('profileNameView').textContent=n;document.getElementById('profileEmailView').textContent=e;localStorage.setItem('username',n);localStorage.setItem('email',e)}
document.getElementById('avatarInput').addEventListener('change',e=>{if(e.target.files[0]){let u=URL.createObjectURL(e.target.files[0]);document.getElementById('profileAvatar').src=u;document.getElementById('railAvatar').src=u;localStorage.setItem('avatar',u)}});document.getElementById('galleryInput').addEventListener('change',e=>{for(let f of e.target.files){let im=document.createElement('img');im.className='photo-thumb';im.src=URL.createObjectURL(f);document.getElementById('photos').insertBefore(im,document.querySelector('.add-photo'))}toast('Fotók hozzáadva a profilodhoz')});function toast(s){let el=document.getElementById('toast');el.textContent=s;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2300)}
if(localStorage.getItem('username'))document.getElementById('username').value=localStorage.getItem('username');if(localStorage.getItem('email'))document.getElementById('email').value=localStorage.getItem('email');if(localStorage.getItem('avatar')){document.getElementById('profileAvatar').src=localStorage.getItem('avatar');document.getElementById('railAvatar').src=localStorage.getItem('avatar')}updateProfile();renderList();renderMessages();
</script></body></html>
