@media(max-width:620px){.chat-head{gap:7px}.head-tools{gap:5px}.head-tools .tool,.head-tools .phone-call{flex-basis:35px;width:35px;height:35px}.chat-person strong{font-size:14px}.chat-person span{font-size:10px}}
/* Put the like count outside the side of each message bubble. */
.msg-row.mine .like-count{left:-9px;right:auto;bottom:-11px}.msg-row:not(.mine) .like-count{right:-9px;left:auto;bottom:-11px}

window.applyFirebaseAccount=async function(user,data){syncOwnerAccess(user);for(const stop of cloudWatchStops.values())try{stop()}catch{}cloudWatchStops.clear();if(!user){if(activePhoneCall||pendingPhoneCall)releasePhoneCall();groupInvites=[];document.body.classList.add('auth-required');firebaseUser=null;profileSaved=false;chats=chats.filter(c=>!c.remote);current=null;persist();if(authMode!=='verify'&&authMode!=='signin')authMode='register';updateProfile();showProfile();return}firebaseUser=user;if(!user.emailVerified){document.body.classList.add('auth-required');profileSaved=false;authMode='verify';document.getElementById('email').value=user.email||'';document.getElementById('verificationMessage').textContent=`Megerősítő email elküldve erre a címre: ${user.email||''}`;updateProfile();showProfile();return}document.body.classList.remove('auth-required');try{const cached=JSON.parse(localStorage.getItem('remoteChats:'+user.uid)||'[]');for(const item of cached){if(item.remote&&!chats.some(c=>c.remote&&c.id===item.id))chats.push(item);if(item.remote)attachRemoteConversation(item.id)}}catch{}profileSaved=true;authMode='profile';let username=data?.username||user.displayName||'',avatar=data?.avatar||'';document.getElementById('username').value=username;document.getElementById('email').value=user.email||data?.email||'';if(avatar){localStorage.setItem('avatar',avatar);setAvatarPreview(avatar)}else setAvatarPreview('');localStorage.setItem('username',username);localStorage.setItem('email',user.email||'');document.getElementById('password').value='';document.getElementById('passwordConfirm').value='';await window.chatFirebase.publishPublicProfile(user,{...data,username,avatar}).catch(e=>console.error('Public profile sync failed',e));cloudWatchStops.set('social',window.chatFirebase.watchSocial(user.uid,state=>{friendState=state;refreshConversationProfiles(state.profiles||{});saveFriendState();if(activeProfile)renderFriendAction()}));cloudWatchStops.set('groups',window.chatFirebase.watchGroupInvites(user.uid,items=>{groupInvites=items;renderFriendLists()}));cloudWatchStops.set('calls',window.chatFirebase.watchIncomingCalls(user.uid,calls=>{if(activePhoneCall&&calls.length){for(const busy of calls)if(busy.id!==activePhoneCall.id)window.chatFirebase.setCallStatus(busy.id,'declined').then(()=>window.chatFirebase.clearCallInbox(user.uid,busy.id)).catch(console.warn)}else if(!activePhoneCall&&calls.length){const call=calls[0];if(pendingPhoneCall?.id!==call.id){pendingPhoneCall=call;showIncomingCall(call)}}else if(!activePhoneCall&&!calls.length){releasePhoneCall()}}));cloudWatchStops.set('conversations',window.chatFirebase.watchConversations(user.uid,mergeRemoteChat));updateProfile();renderList();renderMessages();renderFriendLists();showChats();await window.ChatMobile?.accountReady(user)};document.getElementById('avatarInput').addEventListener('change',e=>{let file=e.target.files&&e.target.files[0];if(!file)return;if(!file.type.startsWith('image/')){toast('Válassz képfájlt');e.target.value='';return}let src=URL.createObjectURL(file),img=new Image();img.onload=()=>{let max=320,scale=Math.min(1,max/Math.max(img.width,img.height)),w=Math.round(img.width*scale),h=Math.round(img.height*scale),canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;canvas.getContext('2d').drawImage(img,0,0,w,h);let value=canvas.toDataURL('image/jpeg',.72);URL.revokeObjectURL(src);if(value.length>850000){toast('A kép túl nagy. Válassz kisebb képet.');e.target.value='';return}localStorage.setItem('avatar',value);setAvatarPreview(value);e.target.value='';toast('Profilkép feltöltve')} ;img.onerror=()=>{URL.revokeObjectURL(src);toast('A képet nem sikerült megnyitni')};img.src=src});function toast(s){let el=document.getElementById('toast');el.textContent=s;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2300)}
updateProfile();renderList();renderMessages();renderFriendLists();if(!profileSaved)showProfile();let viewportFrame=0;function syncViewport(){cancelAnimationFrame(viewportFrame);viewportFrame=requestAnimationFrame(()=>{const viewport=window.visualViewport,root=document.documentElement;root.style.setProperty('--visual-height',Math.round(viewport?.height||window.innerHeight)+'px');root.style.setProperty('--visual-top',Math.round(viewport?.offsetTop||0)+'px')})}syncViewport();if(window.visualViewport){window.visualViewport.addEventListener('resize',syncViewport);window.visualViewport.addEventListener('scroll',syncViewport)}window.addEventListener('resize',syncViewport);window.addEventListener('orientationchange',syncViewport);
markChatRead=function(chat){if(!chat?.remote||!firebaseUser?.uid||current!==chat.id||document.hidden)return;const unseen=[...new Set((chat.messages||[]).filter(m=>m[0]==='received'&&!m[12]&&m[7]).map(m=>m[7]))];for(const message of chat.messages||[])if(message[0]==='received')message[12]=true;chat.unread=0;persist();renderList();if(!unseen.length)return;window.chatFirebase.markConversationRead(chat.id,unseen).then(()=>{chat.readAt=Math.max(Number(chat.readAt)||0,Date.now());persist()}).catch(error=>console.warn('Read receipt sync failed',error))};

function renderFriendLists(){if(!document.getElementById('requestsPane'))return;const incoming=friendState.incoming||[],friends=friendState.friends||[],count=incoming.length+groupInvites.length;document.getElementById('requestCount').textContent=count?`(${count})`:'';const alert=document.getElementById('friendAlert');if(alert){alert.hidden=!count;alert.textContent=count>9?'9+':String(count);alert.setAttribute('aria-label',count+' új jelölés vagy csoportmeghívó')}document.getElementById('friendsCount').textContent=friends.length?`(${friends.length})`:'';document.getElementById('requestsPane').innerHTML=incoming.length?incoming.map((p,i)=>`<div class="friend-card"><span class="result-avatar">${p.avatar?`<img src="${esc(p.avatar)}" alt="">`:'♙'}</span><div class="friend-info"><b>${esc(p.name||'Felhasználó')}</b><small>Ismerősnek jelölt</small></div><button class="create" onclick="acceptFriend(${i})">Elfogadás</button><button class="cancel" onclick="declineFriend(${i})">Elutasítás</button></div>`).join(''):'<div class="empty">Nincs ismerősjelölésed.</div>';document.getElementById('myFriendsPane').innerHTML=friends.length?friends.map((p,i)=>`<div class="friend-card"><span class="result-avatar">${p.avatar?`<img src="${esc(p.avatar)}" alt="">`:'♙'}</span><div class="friend-info"><b>${esc(p.name||'Felhasználó')}</b><small>Ismerős</small></div><button class="blue-btn" onclick="openFriendProfile(${i})">Profil</button></div>`).join(''):'<div class="empty">Még nincsenek ismerőseid.</div>';renderGroupInvites();document.getElementById('requestCount').textContent=count?`(${count})`:''}
