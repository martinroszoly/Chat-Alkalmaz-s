name: Pulze Firebase Hosting deploy
on:
  workflow_dispatch:
  push:
    branches: [codex/free-fcm-spark]
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/free-fcm-spark
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm install --global firebase-tools
      - name: Authenticate Firebase CLI
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"
      - name: Deploy Realtime Database rules
        run: firebase deploy --only database --project chat-alkalmazas-578c8 --non-interactive
      - name: Deploy Firebase Hosting
        if: always()
        run: firebase deploy --only hosting,storage --project chat-alkalmazas-578c8 --non-interactive
