name: Pulse Firebase Hosting deploy
on:
  workflow_dispatch:
  push:
    branches: [codex/free-fcm-spark]
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/free-fcm-spark
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Deploy Realtime Database rules
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          credentials="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$credentials"
          GOOGLE_APPLICATION_CREDENTIALS="$credentials" npx --yes firebase-tools deploy --only database --project chat-alkalmazas-578c8 --non-interactive
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: chat-alkalmazas-578c8
          entryPoint: .
