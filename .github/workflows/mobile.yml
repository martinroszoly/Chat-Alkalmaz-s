name: Mobil app ellenőrzés és Android APK
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm}
      - run: npm ci
      - run: npm test
      - run: npm run build
  android:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: npm ci
      - run: npm run mobile:sync
      - name: Firebase Android konfiguráció
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          elif [ -s android/app/google-services.json ]; then
            echo 'Using Firebase Android configuration from the repository.'
          else
            echo '::warning::Firebase Android configuration is missing. Native push registration will not work.'
          fi
      - run: chmod +x android/gradlew
      - run: ./gradlew --no-daemon assembleDebug
        working-directory: android
      - name: Prepare persistent Android signing key
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Stable release signing is not configured; Android self-update release is skipped."
          else
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release-key.p12
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Read Android release version
        id: version
        run: |
          echo "code=$(sed -n 's/^[[:space:]]*versionCode[[:space:]]*\([0-9]*\).*/\1/p' android/app/build.gradle)" >> "$GITHUB_OUTPUT"
          echo "name=$(sed -n 's/^[[:space:]]*versionName[[:space:]]*\"\(.*\)\".*/\1/p' android/app/build.gradle)" >> "$GITHUB_OUTPUT"
      - name: Build stable signed Android APK
        if: steps.signing.outputs.available == 'true'
        env:
          ANDROID_KEYSTORE_PATH: app/release-key.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease
        working-directory: android
      - name: Publish Android update release
        if: steps.signing.outputs.available == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.code }}
          name: Pulze-pro ${{ steps.version.outputs.name }}
          body: |
            versionCode: ${{ steps.version.outputs.code }}
            versionName: ${{ steps.version.outputs.name }}
          files: android/app/build/outputs/apk/release/app-release.apk
          overwrite_files: true
          make_latest: true
          fail_on_unmatched_files: true
      - uses: actions/upload-artifact@v4
        with:
          name: Pulze-pro-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.available == 'true'
        with:
          name: Pulze-pro-Android-Release
          path: android/app/build/outputs/apk/release/app-release.apk
  ios:
    needs: web
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm}
      - run: npm ci
      - run: npm run mobile:sync
      - name: iOS fordítás ellenőrzése szimulátorra
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath ios-build CODE_SIGNING_ALLOWED=NO build
